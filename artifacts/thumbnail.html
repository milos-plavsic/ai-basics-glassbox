<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Basics Glassbox Thumbnail</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #17211c;
        background:
          linear-gradient(135deg, rgba(45, 117, 85, 0.16), transparent 36%),
          linear-gradient(315deg, rgba(31, 91, 135, 0.16), transparent 42%),
          #f4f1e8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: 430px 1fr;
        gap: 36px;
        width: 1200px;
        height: 630px;
        padding: 54px;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #236d51;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 0.94;
        letter-spacing: 0;
      }

      .summary {
        margin: 22px 0 0;
        color: #35453c;
        font-size: 27px;
        line-height: 1.26;
        font-weight: 650;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .badges span {
        border-radius: 999px;
        padding: 9px 14px;
        background: #fffdf7;
        color: #1f5b87;
        font-size: 20px;
        font-weight: 850;
        box-shadow: 0 8px 24px rgba(28, 37, 31, 0.08);
      }

      .product {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(23, 33, 28, 0.16);
        border-radius: 16px;
        background: #fffdf7;
        box-shadow: 0 22px 60px rgba(28, 37, 31, 0.16);
      }

      .product img {
        position: absolute;
        top: -8px;
        left: -164px;
        width: 934px;
        height: auto;
      }

      .overlay {
        position: absolute;
        right: 26px;
        bottom: 26px;
        width: 300px;
        border-radius: 14px;
        padding: 20px;
        background: rgba(255, 253, 247, 0.94);
        box-shadow: 0 16px 38px rgba(28, 37, 31, 0.18);
      }

      .overlay strong {
        display: block;
        color: #236d51;
        font-size: 34px;
        line-height: 1;
      }

      .overlay span {
        display: block;
        margin-top: 8px;
        color: #35453c;
        font-size: 19px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy" aria-label="Thumbnail text">
        <div>
          <p class="eyebrow">Build With AI: Basics</p>
          <h1>AI Basics Glassbox</h1>
          <p class="summary">A visual RAG debugger that makes chunks, retrieval, prompts, citations, and risk visible.</p>
        </div>
        <div class="badges" aria-label="Core features">
          <span>Chunking</span>
          <span>Vector Search</span>
          <span>Prompt Assembly</span>
          <span>Grounding Checks</span>
        </div>
      </section>
      <section class="product" aria-label="Product screenshot">
        <img src="glassbox-home.png" alt="" />
        <div class="overlay">
          <strong>Glassbox RAG</strong>
          <span>Watch the answer get built from evidence.</span>
        </div>
      </section>
    </main>
  </body>
</html>

name: Refresh dependency lockfile (temporary)

on:
  workflow_dispatch:
  push:
    branches: ["chore/release-readiness"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable toolchain and resolve safe dependency tree
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies.vite='^7.3.7'; p.devDependencies.vitest='^4.1.12'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Upload proposed manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3

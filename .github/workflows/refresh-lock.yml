name: Refresh dependency lockfile (temporary)

on:
  push:
    branches: ["chore/release-readiness"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add explicit Testing Library peer and regenerate lockfile
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.devDependencies['@testing-library/dom']='^10.4.2'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git pull --rebase origin chore/release-readiness
            git commit -m "fix(deps): declare Testing Library DOM peer"
            git push origin HEAD:chore/release-readiness
          fi

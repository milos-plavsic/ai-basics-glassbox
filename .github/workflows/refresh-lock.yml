name: Refresh dependency lockfile (temporary)

on:
  workflow_dispatch:
  push:
    branches: ["chore/release-readiness"]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable toolchain and resolve safe dependency tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vitest@4.1.12
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund vite@7.3.7
          npm audit fix --package-lock-only --ignore-scripts
      - name: Upload proposed manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3

name: Refresh dependency lockfile (temporary)

on:
  workflow_dispatch:
  push:
    branches: ["chore/release-readiness"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/release-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update vulnerable toolchain and resolve safe dependency tree
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies.vite='^7.3.7'; p.devDependencies.vitest='^4.1.12'; p.overrides={...(p.overrides||{}), 'source-map-js':'^1.2.2'}; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit regenerated dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin chore/release-readiness
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to commit."
          else
            git commit -m "fix(deps): patch Vite Vitest and source-map-js advisories"
            git push origin HEAD:chore/release-readiness
          fi
      - name: Upload proposed manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
